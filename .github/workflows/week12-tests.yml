name: Week 12 Tests

on:
  push:
    paths:
      - 'labs/week-12/**'
      - '.github/workflows/week12-tests.yml'
  pull_request:
    paths:
      - 'labs/week-12/**'
      - '.github/workflows/week12-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm ci --prefix labs/week-12/source/api

      - name: Install Frontend dependencies
        run: npm ci --prefix labs/week-12/source/frontend

      - name: Run API tests
        run: npm test --prefix labs/week-12/source/api

      - name: Run Frontend tests
        run: npm test --prefix labs/week-12/source/frontend
